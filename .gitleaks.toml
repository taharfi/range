title = "RANGE public source safeguards"

[extend]
useDefault = true

[[rules]]
id = "helius-rpc-credential"
description = "Helius RPC credential in a URL"
regex = '''(?i)helius-rpc\.com/[^\s"'<>]*[?&]api-key=([a-z0-9_-]{20,})'''
secretGroup = 1
entropy = 3.5

# Reviewed public mint and AMM addresses in documented JSON fields only.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Exact public Solana mint/pool references, not credentials"
regexTarget = "match"
regexes = [
